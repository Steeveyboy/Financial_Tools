# Project metadata and tooling configuration.
# There is deliberately no [build-system]: the package is not built or installed.
# `findata` imports resolve because the repo root is on sys.path; for pytest that
# is guaranteed by `pythonpath = ["."]` below. See docs/REPO_MAP.md.

[project]
name = "findata"
version = "0.1.0"
description = "Financial data tools"
authors = [{ name = "Jonathon Steeves", email = "jonathon.steeves13@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "feedparser>=6.0.14",
    "lxml>=6.1.3",
    "pandas>=2.3.3",
    "pandas-datareader>=0.10.0",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "soupsieve>=2.10",
    "sqlalchemy>=2.0.54",
    "tqdm>=4.70.1",
    "yfinance>=1.7.0",
]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
log_cli_level = "WARNING"

[tool.ruff]
line-length = 100
target-version = "py310"          # lowest version in the CI matrix
exclude = [".venv", "legacy", "notebooks", "findata/db/migrations/versions"]

[tool.ruff.lint]
# Ruff's defaults, written out so they're easy to extend.
# Add a family:   extend-select = ["I", "UP", "B"]
# Silence a rule: ignore = ["E731"]
# Look one up:    ruff rule F401
# Add in future: T20, DTZ, UP, ARG, A, RUF, PR, LOG
select = [
    "E4", "E7", "E9", "F",
    "I", "B"
    ]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Silence a rule in specific files only, e.g.:
# "tests/**" = ["F811"]

[dependency-groups]
# FinBERT sentiment scoring needs transformers AND torch; neither is required to
# run extraction or the schema, so both stay out of the runtime dependencies.
# CPU-only torch is a much smaller wheel:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
dev = [
    "torch>=2.0",
    "transformers>=5.17.0",
]
linting = [
    "ruff>=0.16.10",
]
