name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses:  astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --no-dev --group linting

      - name: Lint with ruff
        # Scope and rules come from [tool.ruff] in pyproject.toml.
        run: uv run ruff check --output-format=github .

      - name: Run tests
        env:
          DATABASE_URL: "sqlite://"
        run: |
          uv run pytest
